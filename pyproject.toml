[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftwatch"
version = "0.1.0"
description = "Label-free accuracy estimation under data shift, plus a monitoring sidecar"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.5",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
shiftwatch = "shiftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]